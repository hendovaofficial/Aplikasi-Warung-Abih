name: Build Warung Abih APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proj
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak zip
        working-directory: .
        run: unzip -q warung_abih_fixed.zip -d proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable

      - name: Buat file Android
        run: |
          flutter create . --platforms=android --org com.warungabih --project-name warung_abih
          sed -i 's/com\.warungabih\.warung_abih/com.warungabih.app/g' android/app/build.gradle* || true
          rm -rf android/app/src/main/kotlin/com/warungabih/warung_abih
          - name: Buat file Android
        run: |
          flutter create . --platforms=android --org com.warungabih --project-name warung_abih
          sed -i 's/com\.warungabih\.warung_abih/com.warungabih.app/g' android/app/build.gradle* || true
          rm -rf android/app/src/main/kotlin/com/warungabih/warung_abih
          sed -i '/org.jetbrains.kotlin.android/s/version "[0-9.]*"/version "2.3.0"/' android/settings.gradle.kts
          sed -i 's/jvmTarget = JavaVersion.VERSION_11.toString()/jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)/' android/app/build.gradle.kts
          sed -i '/org.jetbrains.kotlin.android/s/version "[0-9.]*"/version "2.3.0"/' android/settings.gradle.kts

      - name: Firebase
        run: |
          [ -f ../google-services.json ] && cp ../google-services.json android/app/google-services.json || true
          if [ -f android/app/google-services.json ]; then
            sed -i 's/id("com.android.application") version \(.*\) apply false/&\n    id("com.google.gms.google-services") version "4.4.2" apply false/' android/settings.gradle.kts
            sed -i 's/id("dev.flutter.flutter-gradle-plugin")/&\n    id("com.google.gms.google-services")/' android/app/build.gradle.kts
          fi

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: warung-abih-apk
          path: proj/build/app/outputs/flutter-apk/app-release.apk
