name: Build Warung Abih APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable

      - name: Siapkan project
        run: |
          unzip -q warung_baru.zip -d src
          mkdir proj
          cd proj
          flutter create . --platforms=android --org com.warungabih --project-name warung_sembako
          cp ../src/pubspec.yaml .
          cp ../src/lib/main.dart lib/main.dart
          sed -i 's#<application#<queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Warung Abih"/' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: warung-abih-apk
          path: proj/build/app/outputs/flutter-apk/app-release.apk
